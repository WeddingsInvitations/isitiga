
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undangan Pernikahan</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Domine:wght@700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=TheBest&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- HERO SECTION -->
  <section id="hero">
    <div class="hero-content">
      <h1>Undangan Pernikahan</h1>
      <button id="open-invitation">Buka Undangan</button>
    </div>
  </section>

  <!-- HOME SECTION -->
  <section id="home" class="section">
    <div class="home-container">
      <div class="spacer"></div>
      <img src="IMG_7437.jpg" alt="Pasangan" class="couple-photo" />
      <div class="wedding-title">The Wedding Of</div>
      <img src="tengah.png" alt="Logo Tengah" class="home-logo" />
      <p class="wedding-date">Rabu, 03 Juni 2026</p>

      <div class="scroll-animation">
        <lottie-player
          src="home/scroll-down.json"
          background="transparent"
          speed="1"
          loop
          autoplay>
        </lottie-player>
      </div>
    </div>
  </section>

  <script src="https://unpkg.com/lottie-web@5.12.0/build/player/lottie.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

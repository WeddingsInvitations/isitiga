<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undangan Pernikahan</title>
  <link rel="stylesheet" href="home.css" />
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

</head>
<body>
  <!-- Background tetap -->
  <div class="background-fixed"></div>

  <!-- Section Home -->
  <section id="home">
    <img src="home/IMG_7437.JPG" alt="Foto Pasangan" class="couple-photo" id="fotoPasangan" />

    <p class="wedding-text">The Wedding Of</p>

    <img src="home/couple home.png" alt="Couple Icon" class="couple-icon" />

    <p class="wedding-date">Rabu, 03 Juni 2026</p>

    <!-- Section Scroll-->
    <div class="scroll-animation">
      <lottie-player
        src="home/scroll-down.json"
        background="transparent"
        speed="1"
        loop
        autoplay>
      </lottie-player>
    </div>
  </section>

  <script src="home.js"></script>
  <script src="https://unpkg.com/lottie-web@5.12.0/build/player/lottie.min.js"></script>

</body>
</html>
